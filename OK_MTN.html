<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Configs</title>
<style>
  :root {
    color-scheme: dark;
    --bg0: #07090d;
    --bg1: #0b0d12;
    --bg2: #101521;
    --card: rgba(255,255,255,0.05);
    --card-2: rgba(255,255,255,0.08);
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.12);
    --text: #edf2f7;
    --muted: #b6c0cd;
    --soft: #dce3ec;
    --accent: #ffffff;
    --ok: #39d98a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    min-height: 100%;
    background: var(--bg1);
  }

  body {
    min-height: 100svh;
    background:
      radial-gradient(circle at 20% 18%, rgba(78, 99, 165, 0.20), transparent 30%),
      radial-gradient(circle at 82% 10%, rgba(58, 149, 255, 0.12), transparent 22%),
      radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0.12), transparent 40%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 45%, #07090d 100%);
    background-color: var(--bg1);
    display: grid;
    place-items: center;
    padding: 12px;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06), transparent 32%),
      radial-gradient(circle at 100% 100%, rgba(255,255,255,0.03), transparent 28%);
  }

  .container {
    width: min(760px, calc(100vw - 24px));
    max-height: calc(100svh - 24px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px 16px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.035));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 26px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 24px 80px rgba(0,0,0,0.58),
      inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: auto;
    scrollbar-width: none;
    overscroll-behavior: contain;
  }

  .container::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  .header {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 2px;
  }

  .copy-all {
    width: 100%;
    max-width: 260px;
    min-height: 46px;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(235,239,245,0.92));
    color: #0b0d12;
    border: 1px solid rgba(255,255,255,0.8);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,0.25);
    -webkit-tap-highlight-color: transparent;
  }

  .copy-all:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 32px rgba(0,0,0,0.3);
  }

  .copy-all:active {
    transform: scale(0.98);
  }

  .part {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: rgba(0,0,0,0.22);
    overflow: hidden;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .part[open] {
    border-color: rgba(255,255,255,0.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }

  summary {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    list-style: none;
    cursor: pointer;
    padding: 12px 14px;
    user-select: none;
    background: rgba(255,255,255,0.025);
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  summary::-webkit-details-marker {
    display: none;
  }

  .part[open] > summary {
    background: rgba(255,255,255,0.045);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  summary span {
    grid-column: 2;
    justify-self: center;
    text-align: center;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .copy-part {
    grid-column: 3;
    justify-self: end;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .copy-part:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.14);
    transform: translateY(-1px);
  }

  .copy-part:active {
    transform: scale(0.96);
  }

  textarea {
    display: block;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    background: rgba(0,0,0,0.26);
    color: #dbe2eb;
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace;
    font-size: 12.8px;
    line-height: 1.55;
    padding: 14px 14px 15px;
    min-height: 74px;
    max-height: 240px;
    overflow: auto;
    white-space: pre;
    tab-size: 2;
    caret-color: transparent;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.16) transparent;
  }

  textarea::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  textarea::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.16);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }

  textarea::-webkit-scrollbar-track {
    background: transparent;
  }

  textarea:focus {
    background: rgba(0,0,0,0.34);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(14px);
    background: rgba(17, 24, 18, 0.92);
    color: #ecfff4;
    border: 1px solid rgba(57, 217, 138, 0.28);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    pointer-events: none;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.32);
    letter-spacing: 0.2px;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 640px) {
    body {
      padding: 8px;
    }

    .container {
      width: min(100%, calc(100vw - 16px));
      max-height: calc(100svh - 16px);
      padding: 14px 12px 12px;
      border-radius: 22px;
      gap: 10px;
    }

    .copy-all {
      max-width: none;
      min-height: 44px;
      font-size: 14px;
      padding: 11px 16px;
    }

    summary {
      padding: 10px 12px;
      gap: 8px;
    }

    summary span {
      font-size: 13px;
    }

    .copy-part {
      padding: 6px 12px;
      font-size: 11px;
    }

    textarea {
      font-size: 12px;
      min-height: 62px;
      max-height: 180px;
      padding: 12px 12px 13px;
      line-height: 1.5;
    }
  }
</style>
</head>
